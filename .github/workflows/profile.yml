name: Refresh profile

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - uses: actions/setup-node@v5
        if: env.PROFILE_TOKEN != ''
        with:
          node-version: 22

      - name: Refresh stats
        if: env.PROFILE_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/stats.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib README.md index.html
          git diff --cached --quiet || { git commit -m "Refresh profile stats" && git push; }
