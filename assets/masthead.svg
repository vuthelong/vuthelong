<style>
  .serif{font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,'Hoefler Text',Georgia,serif}
  .sans{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
  .eyebrow{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:11px;letter-spacing:2.4px;font-weight:600;fill:#6b6256;text-transform:uppercase}
  .h{font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,'Hoefler Text',Georgia,serif;font-style:italic;font-weight:400;fill:#2b2620}
  .body{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14px;fill:#6b6256}
  .dt{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:10px;letter-spacing:1.2px;fill:#9a9183;text-transform:uppercase}
  .dd{font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,'Hoefler Text',Georgia,serif;font-size:22px;fill:#2b2620}
  .chip{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12px;fill:#6b6256}

  .wobble{transform-box:view-box;transform-origin:745px 330px;animation:wob 6s ease-in-out infinite}
  .ship{animation:bob 3.2s ease-in-out infinite}
  .wave{animation:drift 5s ease-in-out infinite}
  .w1{animation-delay:-1.6s}.w2{animation-delay:-3.2s}
  .fish{animation:swim 7s ease-in-out infinite}
  .f1{animation-delay:-2.3s;animation-duration:9s}.f2{animation-delay:-4.6s;animation-duration:8s}
  .hook{animation:hook 4s ease-in-out infinite}
  .dot{animation:pulse 2.4s ease-in-out infinite}
  @keyframes wob{0%,100%{transform:skewX(0deg) scaleY(1)}25%{transform:skewX(1.6deg) scaleY(0.992)}75%{transform:skewX(-1.6deg) scaleY(1.006)}}
  @keyframes bob{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(2px,-3px) rotate(0.6deg)}}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,3px)}}
  @keyframes swim{0%,100%{transform:translate(0,0)}50%{transform:translate(22px,-4px)}}
  @keyframes hook{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes pulse{0%,100%{stroke-opacity:0.18;stroke-width:3}50%{stroke-opacity:0.05;stroke-width:6}}
  @media (prefers-reduced-motion:reduce){.wobble,.ship,.wave,.fish,.hook,.dot{animation:none}}</style>
